[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktcoralcls"
version = "0.1.0"
description = "KTCoralCLS: Koh Tao coral genus classification"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "torchvision",
  "pandas",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "pillow",
  "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
